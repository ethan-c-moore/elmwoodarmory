name: Deploy Workflow

on:
  push:
    branches:
      - production

jobs:

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # CLIENT

      - name: Install Node Modules
        working-directory: client
        run: npm ci --no-audit --no-fund --progress=false
      
      - name: Build Client
        working-directory: client
        run: npx ng build --configuration production

      - name: Package dist
        working-directory: client
        run: tar -czf client-dist.tar.gz -C dist .

      # SERVER

      - name: Install Node Modules
        working-directory: server
        run: npm ci --no-audit --no-fund --progress=false

      - name: Build Server
        working-directory: server
        run: npx tsc

      - name: Prune Modules
        working-directory: server
        run: npm prune --omit=dev

      - name: Package Server Bundle
        working-directory: server
        run: |
          mkdir -p bundle
          cp -a dist bundle/dist
          cp -a node_modules bundle/node_modules
          cp package.json bundle/package.json
          if [ -f ecosystem.config.js ]; then cp ecosystem.config.js bundle/ecosystem.config.js; fi
          tar -czf server-bundle.tar.gz -C bundle .

      # ARTIFACTS

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/client-dist.tar.gz
          retention-days: 3

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: server/server-bundle.tar.gz
          retention-days: 3

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/production'
    environment: production
    steps:

      - name: Download Client Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: .
      - name: Download Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: .

      - name: Intilize SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PEM }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Configure SSH
        run: printf "Host ec2\n HostName %s\n User %s\n" "${{ vars.EC2_HOST }}" "${{ vars.EC2_USER }}" >> ~/.ssh/config

      - name: Sanity Check SSH configuration
        run: ssh -v ec2 'echo "SSH OK?"'

      - name: Intilize rSync Staging
        run: |
          mkdir -p .staging/client .staging/server
          tar -xzf client-dist.tar.gz -C .staging/client
          tar -xzf server-bundle.tar.gz -C .staging/server

      - name: Confirm Server has rSync
        run: ssh ec2 'command -v rsync >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y rsync)'

      # RSYNC

      - name: Upload Client dist
        run: |
          CLIENT_DIR="/var/mean/elmwoodarmory/client/dist"
          rsync -avz --delete .staging/client/ ec2:"$CLIENT_DIR/"

      - name: Upload Server Bundle
        run: |
          SERVER_DIR="/var/mean/elmwoodarmory/server"
          rsync -avz --delete .staging/server/ ec2:"$SERVER_DIR/"

      - name: Restart EC2 Services
        run: |
          ssh ec2 'bash -se' <<'EOSSH'
          set -euxo pipefail
          cd /var/mean/elmwoodarmory/server
          npm pkg set scripts.start="node dist/index.js" > /dev/null 2>&1 || true
          pm2 startOrRestart ecosystem.config.js || pm2 reload all
          pm2 save || true
          EOSSH
