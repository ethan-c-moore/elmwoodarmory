name: Deploy Workflow

on:
  push:
    branches:
      - development
      - production

jobs:
  # deploy-development:
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/development'
  #   environment: development
  #   steps:
  #     - name: Stage Tests
  #       run: echo "No Tests to Run, Exiting..."

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: production
    steps:
      - name: Intilize SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PEM }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Configure SSH 
        run: printf "Host ec2\n HostName %s\n User %s\n" "${{ vars.EC2_HOST }}" "${{ vars.EC2_USER }}" >> ~/.ssh/config

      - name: Sanity Check SSH configuration
        run: ssh -v ec2 'echo "SSH OK?"'

      - name: Deploy to EC2
        run: |
          ssh ec2 '
          cd /var/mean/elmwoodarmory/
          && git pull origin production
          && cd client/ && npm install
          && ng build --configuration production
          && cd ../server/ && npm install
          && npx tsc && pm2 startOrRestart ecosystem.config.js'
