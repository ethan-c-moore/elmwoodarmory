<div class="gallery-preview">
  <div class="image-grid top-row">
    <img *ngFor="let image of topImages" [ngSrc]="image" alt="Gallery preview image" width="180" height="180"/>
  </div>

  <div class="gallery-button-container">
    <div class="gallery-button-bushing left"></div>
    <button class="view-gallery-button" routerLink="/gallery">Take a look at our past projects</button>
    <div class="gallery-button-bushing right"></div>
  </div>

  <div class="image-grid bottom-row">
    <img *ngFor="let image of bottomImages" [ngSrc]="image" alt="Gallery preview image" width="180" height="180"/>
  </div>
</div>
